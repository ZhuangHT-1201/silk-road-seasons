name: Feature request
description: Suggest a gameplay, historical, or accessibility improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the player need or missing historical context.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful version of the idea.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay
        - Interface
        - Historical content
        - Accessibility
        - Performance
        - Other
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Historical sources
      description: If relevant, list sources for any proposed historical content.
